# Supabase local/studio config.
# Used by `supabase start`, `supabase db push`, `supabase functions deploy`.
# Production secrets (SUPABASE_SERVICE_ROLE_KEY) are NEVER stored in git.
project_id = "jseafmxepovwjofmhvdh"

[api]
port = 54321
schemas = ["public", "storage", "extensions"]
max_connections = 200

[db]
port = 54322
shadow_database_url = ""
major_version = 15

[studio]
host = "127.0.0.1"
port = 54323

[inbucket]
enabled = true
port = 54324
