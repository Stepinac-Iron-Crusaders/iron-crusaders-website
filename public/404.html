<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Iron Crusaders — Redirecting…</title>
    <script>
      (function () {
        var base = "";
        var ghBase = "/iron-crusaders-website";
        var path = window.location.pathname;
        if (path.indexOf(ghBase) === 0) {
          path = path.slice(ghBase.length);
          base = ghBase;
        }
        if (path.charAt(0) !== "/") {
          path = "/" + path;
        }
        window.location.replace(base + "/#" + path);
      })();
    </script>
  </head>
  <body></body>
</html>
